# networkpolicy.yaml — Network Policy
#
# TASK: Create a NetworkPolicy for the video-processor pods.
#
# Requirements:
#   - Restrict ingress to only necessary sources
#   - Consider what services need to communicate with the video processor
#   - Default deny is a good starting point

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-processor
  namespace: video-analytics
spec:
  podSelector:
    matchLabels:
      app: video-processor
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: video-analytics
      podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
